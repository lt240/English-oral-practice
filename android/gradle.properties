org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 网络超时与重试：让中途挂死的下载快速失败并自动重试，而不是无限等待
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=3

# Windows 上 Defender / 实时扫描会锁住 Kotlin 增量缓存的 .tab 文件，
# 导致 "Could not close incremental caches" 构建失败。关闭增量编译即可绕开
# （代价仅是全量 Kotlin 编译，插件数量很少，影响可忽略）。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.compiler.execution.strategy=in-process
